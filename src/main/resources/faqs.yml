app:
  faq:
    items:
      - id: faq-login
        question: "어떤 계정으로 가입하나요?"
        order: 10
        answer: |
          카카오 계정으로 가입하고 로그인해요.
          처음 로그인하면 닉네임 · 생일 · 성별 · 연인과 만난 날 · 붕붕이 이름을 차례로 정하고, 마지막에 연인을 초대할 수 있어요.
      - id: faq-couple-connect
        question: "연인과 어떻게 연결하나요?"
        order: 20
        answer: |
          연인 초대 화면에서 코드를 주고받으면 바로 연결돼요.
          1. **마이** 화면의 프로필 카드를 눌러 연인 초대 화면으로 가요.
          2. **내 코드 보내기**로 내 코드를 연인에게 보내거나, 연인에게 받은 코드를 입력해요.
          3. **완료**를 누르면 연결돼요.

          가입할 때 **건너뛰기**를 눌렀다면 언제든 마이 화면에서 다시 연결할 수 있어요.
      - id: faq-couple-disconnect
        question: "커플 연결을 해제하면 기록은 어떻게 되나요?"
        order: 30
        answer: |
          연결을 해제하면 함께 쌓은 드라이브 기록과 카드는 더 이상 공유되지 않아요.
          **같은 연인과 다시 연결하면** 이전 기록을 다시 함께 볼 수 있어요.
      - id: faq-location
        question: "위치 권한을 꼭 허용해야 하나요?"
        order: 40
        answer: |
          드라이브 기록과 주변 정보에 위치가 필요해요.
          - 위치를 허용하면 홈에서 **주변 날씨**를 보고, 드라이브 중 **이동 경로 · 거리**가 기록돼요.
          - 허용하지 않아도 앱은 쓸 수 있지만 드라이브 기록 기능은 제한돼요.
          - 권한은 브라우저나 기기 설정에서 언제든 바꿀 수 있어요.
      - id: faq-drive-record
        question: "드라이브 기록은 어떻게 남기나요?"
        order: 50
        answer: |
          홈에서 드라이브를 시작하면 기록이 시작돼요.
          1. 홈이나 장소 상세에서 **드라이브 시작하기**를 눌러요.
          2. 드라이브 이름을 정하고 출발해요.
          3. 목적지에 도착하면 이동 경로와 거리 · 시간이 **기록 지도**에 저장돼요.
      - id: faq-card-deadline
        question: "드라이브 카드는 언제까지 쓸 수 있나요?"
        order: 60
        answer: |
          드라이브를 마친 뒤 24시간 안에 쓰고 고칠 수 있어요.
          - 쓰던 내용은 **자동으로 임시저장**돼요.
          - 아직 쓰지 않은 카드는 홈과 기록 지도의 배너에서 이어서 쓸 수 있어요.
          - **24시간이 지나면** 새로 쓰거나 고칠 수 없어요.
      - id: faq-card-photos
        question: "카드에 사진은 몇 장까지 올릴 수 있나요?"
        order: 70
        answer: |
          카드 한 장에 사진을 최대 2장까지 올릴 수 있어요.
          사진이 2장이면 사진 메뉴의 **사진 순서 바꾸기**로 순서를 바꿀 수 있어요.
      - id: faq-card-share
        question: "드라이브 기록을 공유할 수 있나요?"
        order: 80
        answer: |
          기록 지도에서 카드를 열고 공유하기를 누르면 돼요.
          - **링크 복사**: 카드 링크를 복사해 원하는 곳에 붙여 넣어요.
          - **인스타그램**: 카드를 스토리 이미지로 만들어 공유해요.
          - 카카오톡 · X · 페이스북으로도 보낼 수 있어요.
      - id: faq-archive
        question: "찜한 장소 · 플레이리스트 · 라디오 사연은 어디서 보나요?"
        order: 90
        answer: |
          마이 화면의 보관함 메뉴에서 모아 볼 수 있어요.
          - **찜한 드라이브 코스**
          - **플레이리스트 보관함**
          - **라디오 사연 보관함**
      - id: faq-install
        question: "앱은 어떻게 설치하나요?"
        order: 100
        answer: |
          붕붕어스는 웹 앱이라 앱스토어 없이 홈 화면에 추가해 쓸 수 있어요.
          설치할 수 있는 기기에서는 **마이** 화면에 **앱 설치하기** 메뉴가 보여요.
