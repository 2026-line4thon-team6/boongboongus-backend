spring:
  application:
    name: boongboongus-backend
  config:
    import:
      - optional:file:.env[.properties]
      - classpath:legal-documents.yml
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  auth:
    token-key: ${AUTH_TOKEN_KEY:}
    kakao:
      client-secret: ${KAKAO_LOGIN_CLIENT_SECRET:}
      rest-api-key: ${KAKAO_LOGIN_REST_API_KEY:}
      redirect-uris: ${KAKAO_LOGIN_REDIRECT_URIS:}
  maps:
    kakao:
      local-base-url: https://dapi.kakao.com
      local-key: ${KAKAO_LOCAL_REST_API_KEY:}
      mobility-base-url: https://apis-navi.kakaomobility.com
      mobility-key: ${KAKAO_MOBILITY_REST_API_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
