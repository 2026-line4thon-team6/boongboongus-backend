name: 기능 개발
description: 새 API 또는 기능 구현
title: "[feat] "
body:
  - type: markdown
    attributes:
      value: "기존 이슈를 확인하고 작성해 주세요. 생성 후 담당자를 지정하고 발급된 번호로 브랜치와 PR을 연결합니다. 토큰·비밀번호·실제 개인정보는 제외합니다."
  - type: textarea
    id: goal
    attributes:
      label: 목적과 기대 동작
      placeholder: 어떤 사용자 동작을 지원하고 무엇이 가능해지는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 작업 범위
      placeholder: |
        - [ ] 요청·응답 DTO 및 검증
        - [ ] 업무 로직과 권한 검사
        - [ ] 관련 테스트
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건과 확인 방법
      placeholder: 정상·실패·경계 조건에서 확인할 동작과 검증 방법을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: API·DB·프론트 영향
      description: 관련 명세·화면 링크, 변경할 계약·스키마, 미확정 정책. 없으면 없음.
    validations:
      required: false
